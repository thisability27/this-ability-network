baseURL = 'https://this.ability-net.work/'
title = 'This Ability Network'
defaultContentLanguage = 'en'
defaultContentLanguageInSubdir = true

[languages.en]
weight = 1
label = 'English'
locale = 'en-US'

[languages.ko]
weight = 2
label = '한국어'
locale = 'ko-KR'

[module]
[[module.imports]]
path = 'github.com/imfing/hextra'
[[module.mounts]]
source = 'assets/image'
target = 'static/assets/image'

[params.search]
enable = false

[params.footer]
enable = true
displayPoweredBy = false

[params.theme]
default = 'light'
displayToggle = true

[markup.goldmark.parser.attribute]
block = true
title = true

[params.navbar.logo]
path = 'assets/image/network-logo-mark.png'
width = 35
height = 35

[[languages.en.menus.main]]
identifier = 'tao-network'
name = 'The Network'
url = '/en/#network'
weight = 1

[[languages.en.menus.main]]
identifier = 'tao-programs'
name = 'Programs'
weight = 2

[[languages.en.menus.main]]
identifier = 'tao-orchestra'
name = 'This Ability Orchestra'
url = '/en/#orchestra'
parent = 'tao-programs'
weight = 1

[[languages.en.menus.main]]
