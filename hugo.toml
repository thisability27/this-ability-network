url = '/en/#concerts'
parent = 'tao-programs'
weight = 2

[[languages.en.menus.main]]
identifier = 'tao-event-2027'
name = '2027 International Event'
url = '/en/#2027'
parent = 'tao-programs'
weight = 3

[[languages.en.menus.main]]
identifier = 'tao-contact'
name = 'Contact & Support'
url = '/en/#contact'
weight = 5

[[languages.en.menus.main]]
identifier = 'theme'
weight = 6
[languages.en.menus.main.params]
type = 'theme-toggle'

[[languages.en.menus.main]]
identifier = 'language'
weight = 7
[languages.en.menus.main.params]
type = 'language-switch'

