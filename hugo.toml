baseURL = 'https://this.ability-net.work/'
title = 'This Ability Network'
defaultContentLanguage = 'en'
defaultContentLanguageInSubdir = true

[languages.en]
weight = 1
label = 'English'
locale = 'en-US'

[languages.ko]
weight = 2
label = '한국어'
locale = 'ko-KR'

[module]
[[module.imports]]
path = 'github.com/imfing/hextra'
[[module.mounts]]
source = 'assets/image'
target = 'static/assets/image'

[params.search]
enable = false

[params.footer]
enable = true
displayPoweredBy = false

# 기본 테마는 라이트입니다(light, dark, system 중 선택). 시스템 설정은 따르지 않습니다.
[params.theme]
default = 'light'
displayToggle = true

# 문단에 클래스를 붙이는 {.tao-crumb} 표기를 쓰기 위해 켭니다. 원시 HTML은 켜지 않습니다.
[markup.goldmark.parser.attribute]
block = true
title = true

[params.navbar.logo]
path = 'assets/image/network-logo-mark.png'

# 메뉴는 한 벌만 둡니다. 표시 이름은 Hextra 공식 방식대로 identifier와 같은 키를
# i18n/<언어>.yaml에서 찾고, 없으면 name을 씁니다.
[[menus.main]]
identifier = 'tao-network'
name = 'The Network'
url = '#network'
weight = 1

# 드롭다운: 부모에는 url 없이 identifier만 두고, 자식에 parent로 부모의 identifier를 지정합니다.
# 모바일에서 자식에 pageRef를 쓰면 홈으로 연결되는 알려진 문제가 있어 url을 씁니다.
[[menus.main]]
identifier = 'tao-programs'
name = 'Programs'
weight = 2

[[menus.main]]
identifier = 'tao-orchestra'
name = 'This Ability Orchestra'
url = '#orchestra'
parent = 'tao-programs'
weight = 1

[[menus.main]]
identifier = 'tao-concerts'
name = 'Concerts'
url = '#concerts'
parent = 'tao-programs'
weight = 2

[[menus.main]]
identifier = 'tao-event-2027'
name = '2027 International Event'
url = '#2027'
parent = 'tao-programs'
weight = 3

[[menus.main]]
identifier = 'tao-contact'
name = 'Contact & Support'
url = '#contact'
weight = 5

[[menus.main]]
identifier = 'theme'
weight = 6
[menus.main.params]
type = 'theme-toggle'

[[menus.main]]
identifier = 'language'
weight = 7
[menus.main.params]
type = 'language-switch'
