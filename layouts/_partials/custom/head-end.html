<script>
document.addEventListener('DOMContentLoaded', function () {
  var brand = document.querySelector('.hextra-nav-container nav > a:first-child');
  if (brand?.querySelector(':scope > span')?.textContent.trim()) {
    brand.querySelectorAll(':scope > img').forEach(function (image) { image.alt = ''; });
  }

  document.querySelectorAll('.hextra-language-switcher, .hextra-theme-toggle').forEach(function (button) {
    var labels = Array.from(button.querySelectorAll('span'));
    if (!labels.length) return;
    function updateName() {
      var label = labels.find(function (span) { return getComputedStyle(span).display !== 'none'; });
      if (label) button.setAttribute('aria-label', label.textContent.trim() + ', ' + button.title);
    }
    updateName();
    if (button.classList.contains('hextra-theme-toggle')) {
      new MutationObserver(updateName).observe(button.parentElement, {
        attributes: true, attributeFilter: ['data-theme']
      });
    }
  });

  document.querySelectorAll('.hextra-nav-menu-toggle').forEach(function (toggle) {
    var group = toggle.parentElement;
    group.addEventListener('focusout', function (event) {
      if (event.relatedTarget && group.contains(event.relatedTarget)) return;
      if (toggle.getAttribute('aria-expanded') === 'true') toggle.click();
    });
  });

  var logo = document.querySelector('img[data-tao-dark-src]');
  if (logo) {
    var lightSrc = logo.getAttribute('src');
    var syncLogo = function () {
      var next = document.documentElement.classList.contains('dark') ? logo.dataset.taoDarkSrc : lightSrc;
      if (logo.getAttribute('src') !== next) logo.setAttribute('src', next);
    };
    new MutationObserver(syncLogo).observe(document.documentElement, { attributes: true, attributeFilter: ['class'] });
    syncLogo();
  }

  var hamburger = document.querySelector('.hextra-hamburger-menu');
  if (hamburger) {
    var syncInert = function () {
      var open = hamburger.getAttribute('aria-expanded') === 'true' && getComputedStyle(hamburger).display !== 'none';
      document.querySelectorAll('main, .hextra-footer').forEach(function (region) { region.inert = open; });
    };
    new MutationObserver(syncInert).observe(hamburger, { attributes: true, attributeFilter: ['aria-expanded'] });
    window.addEventListener('resize', syncInert);
    syncInert();
  }
});

{{- if .IsHome }}
(function () {
  var hash = location.hash;
  if (!hash || performance.getEntriesByType('navigation')[0]?.type === 'back_forward') return;
  var anchorId;
  try { anchorId = decodeURIComponent(hash.slice(1)); } catch (e) { return; }

  var root = document.documentElement;
  var previousVisibility = root.style.visibility;
  root.style.visibility = 'hidden';

  document.addEventListener('DOMContentLoaded', function () {
    var anchor = document.getElementById(anchorId);
    if (!anchor) {
      root.style.visibility = previousVisibility;
      return;
    }
    var fontTimeout;
    var fontDeadline = new Promise(function (resolve) {
      fontTimeout = setTimeout(resolve, 350);
    });
    Promise.race([document.fonts?.ready, fontDeadline]).finally(function () {
      clearTimeout(fontTimeout);
      try {
        if (location.hash === hash) anchor.scrollIntoView({ behavior: 'instant' });
      } finally {
        root.style.visibility = previousVisibility;
      }
    });
  }, { once: true });
})();

{{- /* Hextra v0.13 requires fragment-only links on mobile and leaves desktop dropdowns open after same-page navigation. */}}
document.addEventListener('DOMContentLoaded', function () {
  document.querySelectorAll('.hextra-sidebar-container a[href], .hextra-nav-menu-items a[href]').forEach(function (link) {
    if (link.origin !== location.origin || link.pathname !== location.pathname || !link.hash) return;
    var dropdown = link.closest('.hextra-nav-menu-items');
    if (!dropdown) {
      link.setAttribute('href', link.hash);
      return;
    }
    link.addEventListener('click', function (event) {
      var toggle = dropdown.previousElementSibling;
      if (toggle?.getAttribute('aria-expanded') !== 'true') return;
      toggle.click();
      if (event.detail === 0) toggle.focus({ preventScroll: true });
    });
  });
});
{{- end }}
(function () {
  var root = document.documentElement;

  window.addEventListener('pagehide', function () {
    root.classList.remove('tao-smooth-scroll');
  });

  function valid(theme) { return theme === 'light' || theme === 'dark' ? theme : null; }

  var cookieTheme = null;
  var storedTheme = null;
  try { cookieTheme = valid((document.cookie.match(/(?:^|;\s*)tao-theme=([a-z]+)(?:;|$)/) || [])[1]); } catch (e) {}
  try { storedTheme = valid(localStorage.getItem('color-theme')); } catch (e) {}

  var theme = cookieTheme || storedTheme || 'light';
  try { localStorage.setItem('color-theme', theme); } catch (e) {}
  root.classList.remove('light', 'dark');
  root.classList.add(theme);
  root.style.colorScheme = theme;

  function saveThemeCookie() {
    var chosen = null;
    try { chosen = valid(localStorage.getItem('color-theme')); } catch (e) {}
    if (!chosen) return;
    var secure = location.protocol === 'https:' ? '; Secure' : '';
    try { document.cookie = 'tao-theme=' + chosen + '; Path=/; Max-Age=31536000; SameSite=Lax' + secure; } catch (e) {}
  }

  document.addEventListener('click', function (event) {
    var themeOption = event.target.closest('.hextra-theme-toggle-options button');
    if (themeOption) {
      {{- /* Wait for Hextra to update localStorage. */}}
      setTimeout(saveThemeCookie, 0);
      return;
    }
    var link = event.target.closest('a[href]');
    if (!link) return;
    if (link.closest('.hextra-language-options')) {
      var target = (link.pathname.match(/^\/(en|ko)(\/|$)/) || [])[1];
      if (target) { try { localStorage.setItem('tao-lang', target); } catch (e) {} }
      if (location.hash && !link.hash) link.hash = location.hash;
      return;
    }
    if (!event.defaultPrevented && event.button === 0 && !event.metaKey && !event.ctrlKey &&
        !event.shiftKey && !event.altKey && (!link.target || link.target === '_self') &&
        link.origin === location.origin && link.pathname === location.pathname &&
        link.search === location.search) {
      if (link.hash) root.classList.add('tao-smooth-scroll');
      {{- if .IsHome }}
      if (!link.hash && link.matches('.hextra-nav-container nav > a:first-of-type')) {
        event.preventDefault();
        if (location.hash) history.pushState(null, '', link.href);
        if (window.scrollY > 0) {
          root.classList.add('tao-smooth-scroll');
          window.scrollTo({ top: 0 });
        }
      }
      {{- end }}
    }
  });
})();
</script>
