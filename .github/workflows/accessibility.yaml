name: Accessibility checks

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  accessibility:
    name: Test English and Korean accessibility
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: Install Hugo
        run: |
          archive=hugo_0.170.1_linux-amd64.tar.gz
          cd "$RUNNER_TEMP"
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/gohugoio/hugo/releases/download/v0.170.1/$archive" \
            --output "$archive"
          echo "841a5462853aefc9942e4de1e8a5d75584b6a5181941e6ad3f1d745190e03cd8  $archive" | sha256sum --check
          tar -xzf "$archive" hugo
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run accessibility checks
        run: npm run test:accessibility
